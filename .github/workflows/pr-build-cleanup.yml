name: PR Build Cleanup

# Deletes a PR's pr-<number> pre-release once the PR is merged or closed.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    # Fork PRs never published a build.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Delete the PR build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/dev-build.sh cleanup "${PR_NUMBER}"
