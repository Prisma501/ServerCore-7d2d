name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0

      # Stable releases come from main, pre-releases from experimental (docs/adr/0002-branch-per-game-version.md)
      - name: Check the tag is on its release branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          branch=main
          [[ "${TAG}" == *-* ]] && branch=experimental
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${branch}"; then
            echo "::error::${TAG} is not on ${branch}; tags with a '-' release from experimental, the rest from main"
            exit 1
          fi

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    if: needs.build.outputs.has-source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ServerCore
          path: dist/Mods/ServerCore

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          (cd dist && zip -r -X "ServerCore-${version}.zip" Mods)
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [[ ! -s dist/notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [${version}]"
            exit 1
          fi
          prerelease=()
          [[ "${TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${TAG}" "dist/ServerCore-${version}.zip" \
            --title "ServerCore ${version}" --notes-file dist/notes.md "${prerelease[@]}"
